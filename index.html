<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bodefy | Tú pides, tu barrio responde</title>
  <meta name="description" content="Organiza tus compras y tu presupuesto semanal con el planificador gratuito de Bodefy.">
  <meta name="theme-color" content="#157A41">
  <meta property="og:title" content="Bodefy | Tú pides, tu barrio responde">
  <meta property="og:description" content="Tu próxima compra empieza con una buena lista. Planificador semanal gratuito.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_PE">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbf7ef;color:#0b1f3a;font:16px/1.7 system-ui,sans-serif}main{max-width:550px;text-align:center}img{width:50px;height:55px}h1{font-size:36px;letter-spacing:-.04em;line-height:1.2}p{color:#5b655e}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:25px 0}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;border:1px solid #157a41;border-radius:6px;color:#157a41;text-decoration:none;font-weight:600}a:hover{background:#e9f4e9}a:focus-visible{outline:3px solid #1747a6;outline-offset:4px}small{font-size:12px}
  </style>
  <script>
    (() => {
      'use strict';
      const forced = new URLSearchParams(window.location.search).get('v');
      let variant = forced === 'a' || forced === 'b' ? forced : null;
      try {
        const saved = localStorage.getItem('bodefy_variant');
        if (!variant && (saved === 'a' || saved === 'b')) variant = saved;
      } catch (_) { /* La asignación también funciona sin almacenamiento. */ }
      if (!variant) variant = Math.random() < 0.5 ? 'a' : 'b';
      try { localStorage.setItem('bodefy_variant', variant); } catch (_) { /* Respaldo sin persistencia. */ }
      window.location.replace(`${variant}/`);
    })();
  </script>
</head>
<body>
  <main>
    <img src="assets/logo.svg" alt="Bodefy" width="50" height="55">
    <h1>Una buena semana empieza con una lista.</h1>
    <p>Estamos preparando tu planificador de compras y presupuesto semanal.</p>
    <noscript><p>JavaScript está desactivado. Puedes visitar las páginas con estos enlaces; activa JavaScript para usar el planificador.</p></noscript>
    <nav aria-label="Enlaces de respaldo"><a href="a/">Visitar versión A</a><a href="b/">Visitar versión B</a></nav>
    <a href="comparar.html">Comparar las dos versiones</a>
    <p><small>Prototipo académico · UPC 2026 · Laboratorio 8</small></p>
  </main>
</body>
</html>
